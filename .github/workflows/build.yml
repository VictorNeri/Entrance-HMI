name: Build firmware

on:
  push:
    branches: [master]
    paths:
      - "entrance_hmi/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "entrance_hmi/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to what the firmware is developed and flashed with — bump
  # these deliberately (and together with local installs), not
  # implicitly via "latest".
  ARDUINO_CLI_VERSION: "1.5.1"
  # sha256 of arduino-cli_<version>_Linux_64bit.tar.gz, from that
  # release's <version>-checksums.txt — update together with the version.
  ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
  ESP32_CORE_VERSION: "3.3.11"
  ESP32_INDEX_URL: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
  LIBRARIES: "ArduinoJson@7.4.3 PubSubClient@2.8"
  # Same board options as the README's Build section (8MB flash, 3MB
  # APP partition, PSRAM) — the core's defaults target a 4MB variant.
  FQBN: esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled

jobs:
  build:
    # Pinned rather than ubuntu-latest so the build image only changes
    # when this line does (ubuntu-latest moved 24.04 -> 26.04 in Oct 2026).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installed directly rather than via arduino/setup-arduino-cli,
      # whose latest release (v2.0.0) still runs on Node 20 and hasn't
      # been updated since 2024. Pinned version, verified against a
      # pinned checksum.
      - name: Install arduino-cli
        run: |
          tarball="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${tarball}"
          echo "${ARDUINO_CLI_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" arduino-cli
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      # The ESP32 core + toolchains are several hundred MB; caching them
      # takes a warm build from minutes of downloading to seconds.
      - name: Cache Arduino core and libraries
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ env.ESP32_CORE_VERSION }}-${{ env.LIBRARIES }}

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli lib install $LIBRARIES

      # config.h is gitignored (it holds the real OTA password); the
      # example's placeholder values are enough to compile.
      - name: Use example config
        run: cp entrance_hmi/config.example.h entrance_hmi/config.h

      - name: Compile
        # Explicit `shell: bash` runs with pipefail, so a failed compile
        # still fails the step despite being piped through tee.
        shell: bash
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --output-dir build entrance_hmi 2>&1 | tee compile.log
          # Surface the flash/RAM usage lines in the job summary.
          {
            echo '### Firmware size'
            echo '```'
            grep -E '^(Sketch uses|Global variables use)' compile.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Built with the placeholder config.h, so its OTA password is the
      # example's — handy for checking a build, not for flashing as-is.
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: entrance_hmi-${{ github.sha }}
          path: build/entrance_hmi.ino.bin
          if-no-files-found: error
          retention-days: 14
